version: "3.9"

networks:
  auction-network:
    driver: bridge

volumes:
  uploads-data:
  redis-data:

services:
  # ─── Redis (for Socket.io cross-server synchronization) ──────
  redis:
    image: redis:7-alpine
    container_name: auction-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - auction-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
  # ─── Backend Server 1 ─────────────────────────────────────
  server1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auction-server1
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      SERVER_ID: "1"
      PORT: "3001"
      IS_LEADER: "false"
      PEER_SERVERS: "http://server2:3002,http://server3:3003,http://server4:3004"
      MONGO_URI: ${MONGO_URI}
      REDIS_URL: "redis://redis:6379"
    volumes:
      - uploads-data:/app/uploads
    networks:
      - auction-network
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─── Backend Server 2 ─────────────────────────────────────
  server2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auction-server2
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      SERVER_ID: "2"
      PORT: "3002"
      IS_LEADER: "false"
      PEER_SERVERS: "http://server1:3001,http://server3:3003,http://server4:3004"
      MONGO_URI: ${MONGO_URI}
      REDIS_URL: "redis://redis:6379"
    volumes:
      - uploads-data:/app/uploads
    networks:
      - auction-network
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─── Backend Server 3 ─────────────────────────────────────
  server3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auction-server3
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      SERVER_ID: "3"
      PORT: "3003"
      IS_LEADER: "false"
      PEER_SERVERS: "http://server1:3001,http://server2:3002,http://server4:3004"
      MONGO_URI: ${MONGO_URI}
      REDIS_URL: "redis://redis:6379"
    volumes:
      - uploads-data:/app/uploads
    networks:
      - auction-network
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─── Backend Server 4 ─────────────────────────────────────
  server4:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auction-server4
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      SERVER_ID: "4"
      PORT: "3004"
      IS_LEADER: "false"
      PEER_SERVERS: "http://server1:3001,http://server2:3002,http://server3:3003"
      MONGO_URI: ${MONGO_URI}
      REDIS_URL: "redis://redis:6379"
    volumes:
      - uploads-data:/app/uploads
    networks:
      - auction-network
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─── NGINX Load Balancer & Static File Server ────────────────
  nginx:
    image: nginx:alpine
    container_name: auction-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # ─── Mount uploads volume so NGINX can serve images ───────────
      - uploads-data:/app/uploads:ro
    networks:
      - auction-network
    depends_on:
      - redis
      - server1
      - server2
      - server3
      - server4
