events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    
    # ─── Gzip Compression ─────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # ─── Backend Upstream (Load Balancing) ─────────────────────
    upstream auction_backend {
        least_conn;
        server server1:3001;
        server server2:3002;
        server server3:3003;
        server server4:3004;
    }

    # ─── WebSocket Upgrade Detection ──────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ─── Main Server (Handles API, WebSocket, Frontend) ────────
    server {
        listen 80 default_server;
        server_name _;

        # ─── Ngrok Security Header ────────────────────────────
        # Prevents Ngrok from intercepting with its browser warning
        add_header ngrok-skip-browser-warning "true";

        # ─────────────────────────────────────────────────────────
        # STATIC FRONTEND FILES — React build output
        # These files are served directly without proxying
        # ─────────────────────────────────────────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html;
            expires 1d;
            add_header Cache-Control "public, immutable";
        }

        # Frontend index.html (React router needs this for all routes)
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ─────────────────────────────────────────────────────────
        # API ROUTES — Proxy to backend servers
        # ─────────────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://auction_backend;
            proxy_http_version 1.1;

            # ─── Standard Proxy Headers (Critical for Ngrok) ───────
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            
            # ─── Connection Management (prevent hanging) ──────────
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # ─── Buffer Settings (for large responses) ────────────
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        # ─────────────────────────────────────────────────────────
        # WEBSOCKET + Socket.io — Proxy with upgrade headers
        # ─────────────────────────────────────────────────────────
        location /socket.io/ {
            proxy_pass http://auction_backend/socket.io/;
            proxy_http_version 1.1;

            # ─── CRITICAL WebSocket Headers ──────────────────────
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # ─── Standard Headers ────────────────────────────────
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;

            # ─── WebSocket-Specific Timeouts (long-lived connections) ───
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;

            # ─── Disable Buffering for WebSocket ──────────────────
            proxy_buffering off;
            
            # ─── Ngrok header to skip browser warning ────────────
            proxy_set_header ngrok-skip-browser-warning "true";
        }

        # ─────────────────────────────────────────────────────────
        # HEALTH CHECK endpoint
        # ─────────────────────────────────────────────────────────
        location /health {
            proxy_pass http://auction_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─────────────────────────────────────────────────────────
        # UPLOADS — Static files served from backend volumes
        # ─────────────────────────────────────────────────────────
        location /uploads/ {
            proxy_pass http://auction_backend/uploads/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 7d;
            add_header Cache-Control "public";
        }

        # ─────────────────────────────────────────────────────────
        # ERROR PAGES
        # ─────────────────────────────────────────────────────────
        error_page 404 /index.html;
        error_page 500 502 503 504 /index.html;
    }
}