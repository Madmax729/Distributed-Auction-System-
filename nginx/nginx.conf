# ─── NGINX Load Balancer Configuration ───────────────────────
# Distributes requests across 4 backend server instances
# using round-robin strategy with WebSocket support.
# ─────────────────────────────────────────────────────────────

events {
    worker_connections 1024;
}

http {
    # ─── Upstream Backend Pool ────────────────────────────────
    upstream auction_backend {
        least_conn;  # Use least connections for better distribution

        server server1:3001;
        server server2:3002;
        server server3:3003;
        server server4:3004;

        # Keep persistent connections to backends
        keepalive 32;
    }

    # ─── WebSocket Upgrade Map ────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ─── Access and Error Logging ─────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # ─── Main Server Block ────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Increase timeouts for WebSocket connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # ─── API + WebSocket Proxy ────────────────────────────
        location / {
            proxy_pass http://auction_backend;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Forward real client IP
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering for real-time events
            proxy_buffering off;
            proxy_cache_bypass $http_upgrade;
        }

        # ─── Health Check Endpoint ────────────────────────────
        location /nginx-health {
            return 200 '{"status":"ok","loadBalancer":"nginx"}';
            add_header Content-Type application/json;
        }
    }
}
