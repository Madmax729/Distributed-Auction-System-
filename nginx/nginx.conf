events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    resolver 127.0.0.11 valid=10s;
    # ─── Gzip Compression ─────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # ─── Backend Upstream (Load Balancing) ─────────────────────
    upstream auction_backend {
        least_conn;
        server server1:3001;
        server server2:3002;
        server server3:3003;
        server server4:3004;
    }

    # ─── WebSocket Upgrade Detection ──────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ─── Main Server (Handles API, WebSocket, Frontend) ────────
    server {
        listen 80 default_server;
        server_name _;
        
        # CRITICAL: Increase client body size for image uploads
        client_max_body_size 10m;

        # ─── Ngrok Security Header ────────────────────────────
        # Prevents Ngrok from intercepting with its browser warning
        add_header ngrok-skip-browser-warning "true";

        # ─────────────────────────────────────────────────────────
        # UPLOADS — Static files served from backend volumes
        # Supports caching and works across Ngrok/external networks
        # CRITICAL: Must come BEFORE regex patterns (.png, .jpg, etc)
        # ─────────────────────────────────────────────────────────
        location /uploads/ {
    alias /app/uploads/;

    #  FIX PATH RESOLUTION
    try_files $uri $uri/ /uploads/$uri =404;

    autoindex on;
}
        # ─────────────────────────────────────────────────────────
        # STATIC FRONTEND FILES — React build output
        # These files are served directly without proxying
        # ─────────────────────────────────────────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html;
            expires 1d;
            add_header Cache-Control "public, immutable";
        }

        # Frontend index.html (React router needs this for all routes)
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ─────────────────────────────────────────────────────────
        # API ROUTES — Proxy to backend servers
        # ─────────────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://auction_backend;
            proxy_http_version 1.1;

            # ─── Standard Proxy Headers (Critical for Ngrok) ───────
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            
            # ─── Connection Management (prevent hanging) ──────────
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # ─── Buffer Settings (for large responses) ────────────
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        # ─────────────────────────────────────────────────────────
        # WEBSOCKET + Socket.io — Proxy with upgrade headers
        # ─────────────────────────────────────────────────────────
        location /socket.io/ {
            proxy_pass http://auction_backend/socket.io/;
            proxy_http_version 1.1;

                # ─── CRITICAL WebSocket Headers ──────────────────────
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # ─── Standard Headers ────────────────────────────────
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;

            # ─── WebSocket-Specific Timeouts (long-lived connections) ───
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;

            # ─── Disable Buffering for WebSocket ──────────────────
            proxy_buffering off;
            
            # ─── Ngrok header to skip browser warning ────────────
            proxy_set_header ngrok-skip-browser-warning "true";
        }

        # ─────────────────────────────────────────────────────────
        # HEALTH CHECK endpoint (load balanced across all servers)
        # ─────────────────────────────────────────────────────────
        location /health {
            proxy_pass http://auction_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Health check timeout quick
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
            proxy_send_timeout 2s;
        }
        
        # ─────────────────────────────────────────────────────────
        # SERVER INFO endpoint (current server state)
        # ─────────────────────────────────────────────────────────
        location /api/server-info {
            proxy_pass http://auction_backend/api/server-info;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # ─────────────────────────────────────────────────────────
        # ERROR PAGES — Only route frontend 404s to index.html
        # DO NOT route API errors to HTML (causes 502 loops)
        # ─────────────────────────────────────────────────────────
        error_page 404 /index.html;
        # API errors (5xx from backend) should NOT be caught here
        # They will naturally return the upstream error status
    }
}